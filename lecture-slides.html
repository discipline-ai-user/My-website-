<section id="lectureSlidesTool" class="page"><div class="eyebrow">Discipline AI</div><h1 class="title">🎥 Lecture Slide Extractor</h1><p class="sub">Video me sir ke board ko analyse karke har completed/stable board state ka ek clean frame choose karo.</p><div class="card form"><label><span class="label">Lecture video</span><input id="lsVideo" class="input" type="file" accept="video/*"></label><div class="row"><label><span class="label">Sample every (seconds)</span><input id="lsSample" class="input" type="number" min="0.5" max="10" step="0.5" value="2"></label><label><span class="label">Stable for (seconds)</span><input id="lsStable" class="input" type="number" min="1" max="20" step="1" value="6"></label></div><label><span class="label">Minimum slide gap (seconds)</span><input id="lsGap" class="input" type="number" min="3" max="120" step="1" value="10"></label><div class="actions"><button type="button" class="btn" id="lsStart">🔍 Detect completed boards</button><button type="button" class="btn secondary" id="lsReset">Reset</button></div><div id="lsStatus" class="muted"></div></div><div id="lsResults" class="grid" style="margin-top:15px"></div></section>
